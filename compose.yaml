services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-bankuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bankpass}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bank-service:
    image: bank-service:1.0
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 768m

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      rabbitmq:
        condition: service_healthy

    ports:
      - "127.0.0.1:8082:8082"

    environment:
      SERVER_PORT: 8082

      DATABASE_URL: jdbc:h2:file:/app/data/bankdb
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: ""

      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-bankuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-bankpass}

    volumes:
      - bank-data:/app/data

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  rabbitmq-data:
  bank-data: